version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pcc_backend
    environment:
      DATABASE_URL: sqlite:///./data/pcc.db
      SECRET_KEY: super-secret-production-pcc-key-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
    ports:
      - '8000:8000'
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pcc_worker
    command: python -m worker.main
    environment:
      DATABASE_URL: sqlite:///./data/pcc.db
      SECRET_KEY: super-secret-production-pcc-key-change-me
    volumes:
      - ./data:/app/data
    restart: unless-stopped


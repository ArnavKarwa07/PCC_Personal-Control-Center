name: Production Build & Cross-Platform Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # Android APK Release Job
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version  
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SEMVER=$(echo "$VERSION" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || echo "1.0.1")
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT  
          echo "SEMVER=$SEMVER" >> $GITHUB_OUTPUT

      - name: Sync versions in config files
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          SEMVER="${{ steps.version.outputs.SEMVER }}"
          
          # 1. frontend/package.json
          cd frontend
          npm version $SEMVER --no-git-tag-version || true
          
          # 2. frontend/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$SEMVER\"/" src-tauri/tauri.conf.json
          
          # 3. frontend/src-tauri/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$SEMVER\"/" src-tauri/Cargo.toml
          
          # 4. frontend/android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          cd ..

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend web assets
        env:
          VITE_API_URL: ""
        run: cd frontend && npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          mv frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/PCC_$TAG.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcc-android-apk
          path: frontend/android/app/build/outputs/apk/debug/PCC_*.apk

      - name: Attach Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: frontend/android/app/build/outputs/apk/debug/PCC_*.apk
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Desktop Installers Release Job (Tauri v2)
  # (.exe, .dmg, .AppImage)
  # ==========================================
  build-desktop:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: "windows-latest"
          - platform: "macos"
            os: "macos-latest"
          - platform: "linux"
            os: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version  
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SEMVER=$(echo "$VERSION" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || echo "1.0.1")
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT  
          echo "SEMVER=$SEMVER" >> $GITHUB_OUTPUT

      - name: Sync versions in config files
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          SEMVER="${{ steps.version.outputs.SEMVER }}"
          
          # 1. frontend/package.json
          cd frontend
          npm version $SEMVER --no-git-tag-version || true
          
          # 2. frontend/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$SEMVER\"/" src-tauri/tauri.conf.json
          
          # 3. frontend/src-tauri/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$SEMVER\"/" src-tauri/Cargo.toml
          cd ..

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend web assets
        env:
          VITE_API_URL: ""
        run: cd frontend && npm run build

      - name: Build & Publish Tauri Desktop Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./frontend"
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: "Automated production release for PCC (Personal Control Center)."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

name: Production Build & Cross-Platform Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ==========================================
  # Android APK Release Job
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend web assets
        run: cd frontend && npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcc-android-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk

      - name: Attach Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v1.0.1
          name: PCC Production Release v1.0.1
          files: frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Desktop Installers Release Job (Tauri v2)
  # (.exe, .dmg, .AppImage)
  # ==========================================
  build-desktop:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: "windows-latest"
          - platform: "macos"
            os: "macos-latest"
          - platform: "linux"
            os: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend web assets
        run: cd frontend && npm run build

      - name: Build & Publish Tauri Desktop Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./frontend"
          tagName: release-v1.0.1
          releaseName: "PCC Production Release v1.0.1"
          releaseBody: "Automated production release for PCC (Personal Control Center)."
          releaseDraft: false
          prerelease: false

name: Production Build & Cross-Platform Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # Android APK Release Job
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Extract and sync version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG || "v1.0.0";
            const version = tag.replace(/^v/, "");
            const semver = (version.match(/^\d+\.\d+\.\d+/) || ["1.0.0"])[0];

            // 1. package.json
            const pkgPath = "frontend/package.json";
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              pkg.version = version;
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            }

            // 2. tauri.conf.json
            const tauriPath = "frontend/src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              tauri.version = semver;
              fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");
            }

            // 3. Cargo.toml
            const cargoPath = "frontend/src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              let cargo = fs.readFileSync(cargoPath, "utf8");
              cargo = cargo.replace(/^version = ".*"/m, `version = "${semver}"`);
              fs.writeFileSync(cargoPath, cargo);
            }

            // 4. build.gradle
            const gradlePath = "frontend/android/app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              let gradle = fs.readFileSync(gradlePath, "utf8");
              gradle = gradle.replace(/versionName ".*"/, `versionName "${version}"`);
              gradle = gradle.replace(/versionCode \d+/, `versionCode ${process.env.GITHUB_RUN_NUMBER || 2}`);
              fs.writeFileSync(gradlePath, gradle);
            }
          '

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend web assets
        env:
          VITE_API_URL: ""
        run: cd frontend && npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/PCC_${{ env.TAG }}.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcc-android-apk
          path: frontend/android/app/build/outputs/apk/debug/PCC_*.apk

      - name: Attach Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: frontend/android/app/build/outputs/apk/debug/PCC_*.apk
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Desktop Installers Release Job (Tauri v2)
  # (.exe, .dmg, .AppImage)
  # ==========================================
  build-desktop:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: "windows-latest"
          - platform: "macos"
            os: "macos-latest"
          - platform: "linux"
            os: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Extract and sync version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG || "v1.0.0";
            const version = tag.replace(/^v/, "");
            const semver = (version.match(/^\d+\.\d+\.\d+/) || ["1.0.0"])[0];

            // 1. package.json
            const pkgPath = "frontend/package.json";
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              pkg.version = version;
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            }

            // 2. tauri.conf.json
            const tauriPath = "frontend/src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              tauri.version = semver;
              fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");
            }

            // 3. Cargo.toml
            const cargoPath = "frontend/src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              let cargo = fs.readFileSync(cargoPath, "utf8");
              cargo = cargo.replace(/^version = ".*"/m, `version = "${semver}"`);
              fs.writeFileSync(cargoPath, cargo);
            }
          '

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend web assets
        env:
          VITE_API_URL: ""
        run: cd frontend && npm run build

      - name: Build & Publish Tauri Desktop Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./frontend"
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: "Automated production release for PCC (Personal Control Center)."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

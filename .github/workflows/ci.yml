name: CI/CD Pipeline

# Triggers for continuous integration pipeline
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ==========================================
  # Backend CI Job
  # Linting, type checks, and automated tests
  # ==========================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    # Service containers for integration testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc_password
          POSTGRES_DB: pcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pcc:pcc_password@localhost:5432/pcc
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-super-secret-key-32-chars-min
      ENVIRONMENT: test
      DEBUG: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ruff check
        run: cd backend && python -m ruff check .

      - name: Run pytest
        run: cd backend && pytest -v

  # ==========================================
  # Frontend CI Job
  # Type checking and production asset build
  # ==========================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Run Vite build
        run: cd frontend && npm run build
